<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위험 신호 워치독 · MyChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/aimessage/mychat/assets/mychat.css">
<style>
  .sev{
    display:inline-block; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:600;
  }
  .sev.info{background:rgba(78,161,255,0.15); color:#7ec0ff}
  .sev.warn{background:rgba(246,197,68,0.15); color:#ffd66b}
  .sev.danger{background:rgba(255,93,93,0.18); color:#ff9494}
  .rule{
    background:var(--bg-elev);border:1px solid var(--line-soft);
    border-radius:var(--r-md); padding:12px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
  }
  .rule .body{flex:1;min-width:0}
  .rule .body .ti{font-weight:600;font-size:14px}
  .rule .body .de{font-size:12px;color:var(--text-dim);margin-top:2px}
  .alert{
    background:var(--bg-card);border:1px solid var(--line);
    border-radius:var(--r-md); padding:12px; margin-bottom:8px;
  }
  .alert.ack{opacity:0.5}
  .alert h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:6px}
  .alert .when{font-size:11px;color:var(--text-mute)}
  .alert .det{font-size:13px;color:var(--text-dim);margin:6px 0;line-height:1.6}
</style>
</head>
<body>
<div id="top"></div>

<div class="mc-wrap">

  <div class="mc-hero">
    <h1>🛡️ 위험 신호 워치독</h1>
    <p>
      평소의 너와 크게 다른 패턴(수면·심박·통화 시간·이동·소통 빈도)이 잡히면 아바타가
      <b>먼저 안부를 건넵니다</b>. 번아웃·우울·건강 이상의 <b>조기 발견</b>이 목표입니다.
    </p>
  </div>

  <!-- master -->
  <div class="mc-section">
    <div class="mc-rowitem">
      <div class="body">
        <div class="ti">워치독 활성화</div>
        <div class="de">백그라운드 룰 엔진이 이상 패턴을 주기적으로 점검합니다.</div>
      </div>
      <label class="mc-switch"><input type="checkbox" id="sw-master"><span class="sl"></span></label>
    </div>
    <div class="mc-rowitem">
      <div class="body">
        <div class="ti">선제 알림</div>
        <div class="de">감지 시 인박스 + 푸시(가능 시)로 안부 메시지 전달.</div>
      </div>
      <label class="mc-switch"><input type="checkbox" id="sw-push"><span class="sl"></span></label>
    </div>
    <div class="mc-rowitem">
      <div class="body">
        <div class="ti">민감도</div>
        <div class="de">높을수록 작은 변화에도 신호가 잡힙니다.</div>
      </div>
      <div class="mc-toggle">
        <button data-sens="low">낮음</button>
        <button data-sens="med" class="on">보통</button>
        <button data-sens="high">높음</button>
      </div>
    </div>
  </div>

  <!-- rules -->
  <div class="mc-section">
    <h2>📐 룰 <span class="badge" id="rule-count">0</span></h2>
    <p class="hint">기본 룰을 켜거나 끌 수 있습니다. 커스텀 룰은 다음 버전에서.</p>
    <div id="rule-list"></div>
  </div>

  <!-- alerts -->
  <div class="mc-section">
    <h2>🚨 최근 알림 <span class="badge" id="alert-count">0</span></h2>
    <div class="mc-row">
      <button class="mc-btn sm" id="btn-scan">🧪 지금 점검</button>
      <button class="mc-btn sm" id="btn-ack-all">모두 확인 처리</button>
    </div>
    <div id="alert-list" style="margin-top:10px"></div>
    <div id="alert-empty" class="mc-empty" style="display:none">
      <div class="ico">✅</div>
      <div class="ti">현재 이상 신호 없음</div>
      <div class="de">평소의 너와 다른 신호가 없습니다.</div>
    </div>
  </div>

</div>

<script src="/aimessage/mychat/assets/mychat.js"></script>
<script>
(function(){
  'use strict';

  document.getElementById('top').innerHTML = mc.renderTopbar({
    title: '🛡️ 위험 신호 워치독',
    sub: '평소와 다른 신호를 먼저 잡습니다'
  });

  // ---------- config ----------
  var CFG_KEY = 'mychat_watchdog_cfg_v1';
  function loadCfg(){
    var c = mc.lsGet(CFG_KEY, null);
    if (!c){
      c = {
        enabled: true, push: true, sensitivity: 'med',
        rules: {
          sleep_short:  { on:true,  name:'수면 부족 누적',     de:'평균 대비 -25% 이상 3일 연속'},
          hr_resting:   { on:true,  name:'안정 심박 상승',     de:'평균 안정 심박 +8 bpm 이상'},
          comm_silence: { on:true,  name:'소통 침묵',          de:'친밀 연락처와 7일 무연락'},
          night_burst:  { on:false, name:'새벽 통화/문자 폭증',de:'03:00~06:00 통신 +200%'},
          mood_low:     { on:true,  name:'기분 하강 추정',     de:'일일 요약 정서 톤 부정 누적'},
          finance_burst:{ on:false, name:'지출 급증',          de:'평소 대비 일일 지출 +150%'}
        }
      };
    }
    return c;
  }
  function saveCfg(c){ mc.lsSet(CFG_KEY, c); }
  var cfg = loadCfg();

  // ---------- seed demo alerts ----------
  (function seedAlerts(){
    var list = mc.anomalyList();
    if (list && list.length) return;
    mc.anomalyAdd({ kind:'sleep_short', severity:'warn', title:'수면 부족 3일 연속', detail:'평균 7h12m → 최근 3일 5h28m. 컨디션 코칭 권장.', ts: Date.now()-1000*60*60*8 });
    mc.anomalyAdd({ kind:'comm_silence', severity:'info', title:'친한 친구와 9일째 무연락', detail:'평소 주1회 연락하던 김OO과 9일째 메시지 없음. 안부 메시지를 보내볼까요?', ts: Date.now()-1000*60*60*36 });
  })();

  // ---------- render ----------
  function renderTop(){
    document.getElementById('sw-master').checked = !!cfg.enabled;
    document.getElementById('sw-push').checked = !!cfg.push;
    document.querySelectorAll('[data-sens]').forEach(function(b){
      b.classList.toggle('on', b.dataset.sens === cfg.sensitivity);
    });
  }
  function renderRules(){
    var keys = Object.keys(cfg.rules);
    document.getElementById('rule-count').textContent = keys.length;
    document.getElementById('rule-list').innerHTML = keys.map(function(k){
      var r = cfg.rules[k];
      return ''
        + '<div class="rule" data-r="'+k+'">'
        +   '<div class="body">'
        +     '<div class="ti">'+mc.esc(r.name)+'</div>'
        +     '<div class="de">'+mc.esc(r.de)+'</div>'
        +   '</div>'
        +   '<label class="mc-switch"><input type="checkbox" '+(r.on?'checked':'')+'><span class="sl"></span></label>'
        + '</div>';
    }).join('');
  }
  function renderAlerts(){
    var list = mc.anomalyList();
    document.getElementById('alert-count').textContent = list.length;
    var host = document.getElementById('alert-list');
    var empty = document.getElementById('alert-empty');
    if (!list.length){ host.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    host.innerHTML = list.map(function(a){
      var sev = a.severity || 'info';
      var icon = sev==='danger'?'🚨' : sev==='warn'?'⚠️' : 'ℹ️';
      return ''
        + '<div class="alert'+(a.ack?' ack':'')+'" data-a="'+mc.esc(a.id)+'">'
        +   '<h4>'+icon+' '+mc.esc(a.title)+' <span class="sev '+sev+'" style="margin-left:auto">'+sev.toUpperCase()+'</span></h4>'
        +   '<div class="when">'+mc.fmtTime(a.ts)+'</div>'
        +   '<div class="det">'+mc.esc(a.detail)+'</div>'
        +   '<div style="display:flex;gap:6px;flex-wrap:wrap">'
        +     (a.ack ? '<span class="mc-chip ok">✓ 확인됨</span>'
                    : '<button class="mc-btn sm" data-act="ack">✓ 확인 처리</button>')
        +     '<button class="mc-btn sm" data-act="decide">🎯 의사결정 카드</button>'
        +     '<button class="mc-btn sm ghost" data-act="inbox">📥 인박스에</button>'
        +   '</div>'
        + '</div>';
    }).join('');
  }

  // ---------- bind ----------
  document.getElementById('sw-master').addEventListener('change', function(e){ cfg.enabled = e.target.checked; saveCfg(cfg); });
  document.getElementById('sw-push').addEventListener('change', function(e){ cfg.push = e.target.checked; saveCfg(cfg); });
  document.querySelectorAll('[data-sens]').forEach(function(b){
    b.addEventListener('click', function(){
      cfg.sensitivity = b.dataset.sens;
      document.querySelectorAll('[data-sens]').forEach(function(x){ x.classList.toggle('on', x===b); });
      saveCfg(cfg);
    });
  });
  document.getElementById('rule-list').addEventListener('change', function(e){
    var card = e.target.closest('[data-r]'); if (!card) return;
    cfg.rules[card.dataset.r].on = e.target.checked;
    saveCfg(cfg);
  });
  document.getElementById('btn-scan').addEventListener('click', function(){
    var btn = this; var orig = btn.innerHTML;
    btn.innerHTML='<span class="mc-spin"></span> 점검 중...'; btn.disabled=true;
    mc.api('/aimessage/mychat/api/anomaly.php', { action:'scan', cfg: cfg }).then(function(r){
      btn.innerHTML=orig; btn.disabled=false;
      // local synthesis fallback
      if (!(r && r.ok && Array.isArray(r.alerts))){
        // randomly maybe add an "info" anomaly
        if (Math.random()<0.5){
          mc.anomalyAdd({ kind:'mood_low', severity:'info', title:'정서 톤 약간 하강', detail:'최근 3일 일일 요약에서 부정 어휘 비율이 미세하게 상승. 휴식 권장.' });
          mc.toast('새 신호 1건','warn',1500);
        } else {
          mc.toast('이상 신호 없음','ok',1500);
        }
      } else {
        (r.alerts||[]).forEach(function(a){ mc.anomalyAdd(a); });
        mc.toast('새 신호 '+r.alerts.length+'건','warn',1500);
      }
      renderAlerts();
    });
  });
  document.getElementById('btn-ack-all').addEventListener('click', function(){
    var list = mc.anomalyList();
    list.forEach(function(a){ if (!a.ack) mc.anomalyAck(a.id); });
    renderAlerts();
    mc.toast('모두 확인 처리','ok',1200);
  });
  document.getElementById('alert-list').addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var card = e.target.closest('[data-a]'); var id = card.dataset.a;
    var a = mc.anomalyList().filter(function(x){ return x.id===id; })[0];
    if (!a) return;
    if (btn.dataset.act==='ack'){
      mc.anomalyAck(id); renderAlerts();
    } else if (btn.dataset.act==='decide'){
      // route to decision assistant with seed
      mc.inboxAdd({ source:'manual', kind:'event', title:'🛡️ '+a.title, summary:a.detail });
      location.href = '/aimessage/mychat/decision-assistant.html';
    } else if (btn.dataset.act==='inbox'){
      mc.inboxAdd({ source:'manual', kind:'note', title:'🛡️ '+a.title, summary:a.detail });
      mc.toast('인박스에 저장','ok',1200);
    }
  });

  renderTop(); renderRules(); renderAlerts();
})();
</script>
</body>
</html>
